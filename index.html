<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhysiXR – Interactive Spatial Physics Lab</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: {
              900: '#0a0a0a',
              800: '#141414',
              700: '#1e1e1e',
              600: '#2a2a2a',
              border: '#262626'
            },
            accent: {
              blue: '#0d6efd',
              blueHover: '#0b5ed7',
              pillBg: 'rgba(13, 110, 253, 0.15)',
              pillBorder: 'rgba(13, 110, 253, 0.3)',
              spatialGreen: '#4ade80',
              spatialYellow: '#facc15',
              red: '#ef4444'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body class="w-screen h-screen relative overflow-hidden bg-[#0a0a0a] text-white select-none">
  <div id="app"></div>
  <div id="spatial-hud-root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
